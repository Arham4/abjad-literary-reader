services:
  abjad-reader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abjad-literary-reader
    ports:
      - "4000:4000"
    mem_limit: 48m
    environment:
      - PORT=4000
    volumes:
      - ./public/audio/cache:/app/public/audio/cache
    restart: unless-stopped
